---

- name: 1.3.1 | PATCH | Ensure AIDE is installed
  when:
    - amzn2023cis_config_aide
    - amzn2023cis_rule_1_3_1
  tags:
    - level1-server
    - aide
    - patch
    - rule_1.3.1
    - NIST800-53R5_AU-2
  block:
    - name: 1.3.1 | PATCH | Ensure AIDE is installed | Install AIDE
      ansible.builtin.package:
        name: '{{ aide_packages }}'
        state: present
      register: discovered_aide_pkg_added

    - name: 1.3.1 | PATCH | Ensure AIDE is installed | Recapture packages
      when: discovered_aide_pkg_added.skipped is not defined
      ansible.builtin.package_facts:
        manager: auto

    - name: 1.3.1 | AUDIT | Ensure AIDE is installed | Check file exists
      ansible.builtin.stat:
        path: '{{ amzn2023cis_aide_db_file }}'
      register: discovered_aide_db_file

    - name: 1.3.1 | AUDIT | Ensure AIDE is installed | Check current db file age
      when: discovered_aide_db_file.stat.exists
      ansible.builtin.find:
        path: '{{ amzn2023cis_aide_db_file | dirname }}'
        pattern: '{{ amzn2023cis_aide_db_file | basename }}'
        age: '{{ amzn2023cis_aide_db_file_age }}'
      register: discovered_aide_db_age

    - name: 1.3.1 | PATCH | Ensure AIDE is installed | Configure AIDE
      when:
        - not ansible_check_mode
        - not discovered_aide_db_file.stat.exists or
          (discovered_aide_db_age.files | length > 0) or
          amzn2023cis_aide_db_recreate
      block:
        - name: 1.3.1 | PATCH | Ensure AIDE is installed | Build AIDE DB
          ansible.builtin.command: '{{ aide_initiate_command }}'
          changed_when: true

        - name: 1.3.1 | PATCH | Ensure AIDE is installed | Build AIDE DB | Wait for file before continuing
          ansible.builtin.wait_for:
            path: /var/lib/aide/aide.db.new.gz

        - name: 1.3.1 | PATCH | Ensure AIDE is installed | Build AIDE DB | copy AIDE DB
          ansible.builtin.copy:
            src: /var/lib/aide/aide.db.new.gz
            dest: '{{ amzn2023cis_aide_db_file }}'
            remote_src: true
            mode: 'u-x,g-wx,o-rwx'
          register: discovered_aide_db_cp
          failed_when:
            - not ansible_check_mode
            - discovered_aide_db_cp.failed

- name: 1.3.2 | PATCH | Ensure filesystem integrity is regularly checked
  when: amzn2023cis_rule_1_3_2
  tags:
    - level1-server
    - aide
    - file_integrity
    - patch
    - rule_1.3.2
    - NIST800-53R5_AU-2
  ansible.builtin.cron:
    name: Run AIDE integrity check
    cron_file: "{{ amzn2023cis_aide_cron['cron_file'] }}"
    user: "{{ amzn2023cis_aide_cron['cron_user'] }}"
    minute: "{{ amzn2023cis_aide_cron['aide_minute'] | default('0') }}"
    hour: "{{ amzn2023cis_aide_cron['aide_hour'] | default('5') }}"
    day: "{{ amzn2023cis_aide_cron['aide_day'] | default('*') }}"
    month: "{{ amzn2023cis_aide_cron['aide_month'] | default('*') }}"
    weekday: "{{ amzn2023cis_aide_cron['aide_weekday'] | default('*') }}"
    job: "{{ amzn2023cis_aide_cron['aide_job'] }}"

- name: 1.3.3 | PATCH | Ensure cryptographic mechanisms are used to protect the integrity of audit tools
  when: amzn2023cis_rule_1_3_3
  tags:
    - level1-server
    - aide
    - file_integrity
    - patch
    - rule_1.3.3
    - NIST800-53R5_AU-2
  ansible.builtin.blockinfile:
    path: /etc/aide.conf
    marker: '# {mark} Audit tools - CIS benchmark - Ansible-lockdown'
    block: |
      /sbin/auditctl p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
      /sbin/auditd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
      /sbin/augenrules p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
      /sbin/aureport p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
      /sbin/ausearch p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
      /sbin/autrace p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
      /sbin/audispd p+i+n+u+g+s+b+acl+selinux+xattrs+sha512
    validate: aide -D --config %s
