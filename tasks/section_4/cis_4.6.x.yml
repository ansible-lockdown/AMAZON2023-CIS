---

- name: 4.6.2 | PATCH | Ensure system accounts are secured
  when: amzn2023cis_rule_4_6_2
  tags:
    - level1-server
    - patch
    - accounts
    - rule_4.6.2
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-5
    - NIST800-53R5_MP-5
  block:
    - name: 4.6.2 | PATCH | Ensure system accounts are secured | Set nologin
      when:
        - item.id != "root"
        - item.id != "sync"
        - item.id != "shutdown"
        - item.id != "halt"
        - item.id != "nfsnobody"
        - item.uid < min_int_uid | int
        - item.shell != "      /bin/false"
        - item.shell != "      /usr/sbin/nologin"
      ansible.builtin.user:
        name: '{{ item.id }}'
        shell: /usr/sbin/nologin
      loop: '{{ prelim_captured_passwd_data }}'
      loop_control:
        label: '{{ item.id }}'

    - name: 4.6.2 | PATCH | Ensure system accounts are secured | Lock accounts
      when:
        - item.id != "halt"
        - item.id != "shutdown"
        - item.id != "sync"
        - item.id != "root"
        - item.id != "nfsnobody"
        - item.uid < min_int_uid | int
        - item.shell != "      /bin/false"
        - item.shell != "      /usr/sbin/nologin"
      ansible.builtin.user:
        name: '{{ item.id }}'
        password_lock: true
      loop: '{{ prelim_captured_passwd_data }}'
      loop_control:
        label: '{{ item.id }}'

- name: 4.6.3 | PATCH | Ensure default user shell timeout is 900 seconds or less
  when: amzn2023cis_rule_4_6_3
  tags:
    - level1-server
    - patch
    - accounts
    - rule_4.6.3
    - NIST800-53R5_AC-11
  ansible.builtin.blockinfile:
    path: '{{ item.path }}'
    state: '{{ item.state }}'
    marker: '# {mark} - CIS benchmark - Ansible-lockdown'
    create: true
    mode: u-x,go-wx
    block: |
      TMOUT={{ amzn2023cis_shell_session_timeout.timeout }}
      export TMOUT
      readonly TMOUT
  loop:
    - {path: '{{ amzn2023cis_shell_session_timeout.file }}', state: present}
    - {path: /etc/profile, state: "{{ (amzn2023cis_shell_session_timeout.file == '/etc/profile') | ternary('present', 'absent') }}"}

- name: 4.6.4 | PATCH | Ensure default group for the root account is GID 0
  when: amzn2023cis_rule_4_6_4
  tags:
    - level1-server
    - patch
    - accounts
    - rule_4.6.4
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
  ansible.builtin.user:
    name: root
    group: 0

- name: 4.6.5 | PATCH | Ensure default user umask is 027 or more restrictive
  when: amzn2023cis_rule_4_6_5
  tags:
    - level1-server
    - patch
    - accounts
    - rule_4.6.5
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: 4.6.5 | PATCH | Ensure default user umask is 027 or more restrictive | Set UMASK in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*UMASK\s+'
        line: UMASK {{ amzn2023cis_umask }}

    - name: 4.6.5 | PATCH | Ensure default user umask is 027 or more restrictive | Set USERGROUPS_ENAB in /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: ^USERGROUPS_ENAB
        line: USERGROUPS_ENAB no

    - name: 4.6.5 | AUDIT | Ensure default user umask is 027 or more restrictive | Find shell initialization files setting umask
      ansible.builtin.shell: grep -lPsi -- '^\h*umask\h+\S' /etc/profile /etc/bashrc /etc/profile.d/*.sh
      changed_when: false
      failed_when: discovered_umask_files.rc not in [ 0, 1, 2 ]
      check_mode: false
      register: discovered_umask_files

    - name: 4.6.5 | PATCH | Ensure default user umask is 027 or more restrictive | Tighten weak umask statements
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '(?i)^(\s*umask\s+)(?!0?[0-7][2367]7\b)[^\s#;]+'
        replace: '\g<1>{{ amzn2023cis_umask }}'
      loop: "{{ discovered_umask_files.stdout_lines }}"

    - name: 4.6.5 | PATCH | Ensure default user umask is 027 or more restrictive | Set umask when no shell initialization file sets one
      when: discovered_umask_files.stdout_lines | length == 0
      ansible.builtin.copy:
        dest: /etc/profile.d/50-systemwide_umask.sh
        content: |
          umask {{ amzn2023cis_umask }}
        owner: root
        group: root
        mode: u-x,go-wx

- name: 4.6.6 | PATCH | Ensure root password is set
  when: amzn2023cis_rule_4_6_6
  tags:
    - level1-server
    - patch
    - accounts
    - root
    - rule_4.6.6
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-5
    - NIST800-53R5_MP-2
  ansible.builtin.debug:
    msg: The root password has been set as per the assert in early stages
