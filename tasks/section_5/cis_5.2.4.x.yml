---

- name: |
    "5.2.4.1 | PATCH | Ensure audit log files are mode 0640 or less permissive"
    "5.2.4.2 | PATCH | Ensure only authorized users own audit log files"
    "5.2.4.3 | PATCH | Ensure only authorized groups are assigned ownership of audit log files"
  when:
    - amzn2023cis_rule_5_2_4_1 or amzn2023cis_rule_5_2_4_2 or amzn2023cis_rule_5_2_4_3
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.1
    - rule_5.2.4.2
    - rule_5.2.4.3
    - NIST800-53R5_AU-3
  block:
    - name: 5.2.4.1 | AUDIT | Ensure audit log files are mode 0640 or less permissive | Find audit log files
      ansible.builtin.find:
        paths: "{{ prelim_auditd_logfile.stdout | dirname }}"
        file_type: file
      register: discovered_auditd_logfiles

    - name: 5.2.4.1 | PATCH | Ensure audit log files are mode 0640 or less permissive | Set mode
      when: amzn2023cis_rule_5_2_4_1
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: u-x,g-wx,o-rwx
      loop: "{{ discovered_auditd_logfiles.files }}"

    - name: 5.2.4.2 | PATCH | Ensure only authorized users own audit log files | Set owner
      when: amzn2023cis_rule_5_2_4_2
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
      loop: "{{ discovered_auditd_logfiles.files }}"

    - name: 5.2.4.3 | PATCH | Ensure only authorized groups are assigned ownership of audit log files | Set group
      when:
        - amzn2023cis_rule_5_2_4_3
        - item.gr_name not in ['root', 'adm']
      ansible.builtin.file:
        path: "{{ item.path }}"
        group: root
      loop: "{{ discovered_auditd_logfiles.files }}"

- name: 5.2.4.4 | PATCH | Ensure the audit log directory is 0750 or more restrictive
  when: amzn2023cis_rule_5_2_4_4
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.4
  ansible.builtin.file:
    path: "{{ prelim_auditd_logfile.stdout | dirname }}"
    state: directory
    mode: g-w,o-rwx

- name: 5.2.4.5 | PATCH | Ensure audit configuration files are 640 or more restrictive
  when: amzn2023cis_rule_5_2_4_5
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.5
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: '{{ item.path }}'
    mode: g-wx,o-rwx
  loop: '{{ prelim_auditd_conf_files.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'

- name: 5.2.4.6 | PATCH | Ensure audit configuration files are owned by root
  when: amzn2023cis_rule_5_2_4_6
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.6
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: root
  loop: '{{ prelim_auditd_conf_files.files }}'
  loop_control:
    label: '{{ item.path }}'

- name: 5.2.4.7 | PATCH | Ensure audit configuration files belong to group root
  when: amzn2023cis_rule_5_2_4_7
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.7
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: '{{ item.path }}'
    group: root
  loop: '{{ prelim_auditd_conf_files.files }}'
  loop_control:
    label: '{{ item.path }}'

- name: 5.2.4.8 | PATCH | Ensure audit tools are 755 or more restrictive
  when: amzn2023cis_rule_5_2_4_8
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.8
    - NIST800-53R5_AU-3
  block:
    - name: 5.2.4.8 | AUDIT | Ensure audit tools are 755 or more restrictive | Get current mode
      ansible.builtin.stat:
        path: '{{ item }}'
      register: discovered_audit_bins
      loop:
        - /sbin/auditctl
        - /sbin/aureport
        - /sbin/ausearch
        - /sbin/autrace
        - /sbin/auditd
        - /sbin/augenrules

    - name: 5.2.4.8 | PATCH | Ensure audit tools are 755 or more restrictive | set if required
      when: not item.stat.mode is match('07(0|5)0')
      ansible.builtin.file:
        path: '{{ item.item }}'
        mode: u+x,g-w,o-rwx

      loop: '{{ discovered_audit_bins.results }}'
      loop_control:
        label: '{{ item.item }}'

- name: 5.2.4.9 | PATCH | Ensure audit tools are owned by root
  when: amzn2023cis_rule_5_2_4_9
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.9
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: '{{ item }}'
    owner: root
    group: root
  loop:
    - /sbin/auditctl
    - /sbin/aureport
    - /sbin/ausearch
    - /sbin/autrace
    - /sbin/auditd
    - /sbin/augenrules

- name: 5.2.4.10 | PATCH | Ensure audit tools belong to group root
  when: amzn2023cis_rule_5_2_4_10
  tags:
    - level2-server
    - patch
    - auditd
    - rule_5.2.4.10
    - NIST800-53R5_AU-3
  ansible.builtin.file:
    path: '{{ item }}'
    group: root
  loop:
    - /sbin/auditctl
    - /sbin/aureport
    - /sbin/ausearch
    - /sbin/autrace
    - /sbin/auditd
    - /sbin/augenrules
