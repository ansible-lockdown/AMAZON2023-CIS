- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  listen: Restart sshd

- name: Restart sshd service
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  listen: Restart sshd

- name: Restart postfix
  ansible.builtin.systemd:
    name: postfix
    state: restarted

- name: Grub2cfg
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  changed_when: true
  ignore_errors: true

- name: Restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Systemd daemon reload
  ansible.builtin.systemd:
    daemon-reload: true

- name: Audit_immutable_fact
  when: discovered_auditd_immutable_check.rc == 0
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  notify: Change_requires_reboot

- name: Auditd rules reload
  when: discovered_auditd_immutable_check.rc == 1
  ansible.builtin.command: augenrules --load
  changed_when: true
  failed_when: discovered_augenrule_load.rc not in [ 0, 1 ]
  register: discovered_augenrule_load
  listen: Restart auditd

- name: Restart auditd service  # noqa: command-instead-of-module
  when: not system_is_container
  ansible.builtin.command: /sbin/service auditd restart
  changed_when: true
  listen: Restart auditd

- name: Change_requires_reboot
  ansible.builtin.set_fact:
    change_requires_reboot: true
